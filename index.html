<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ZUCCA 勤怠</title>
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZUCCA 勤怠">
<link rel="manifest" href="manifest.webmanifest"><!-- v16: スタッフ削除の自動復活を修正・退勤は実時刻 -->
<style>body{font-family:-apple-system,sans-serif;background:#f5f6f8;margin:0;color:#111827}.w{max-width:760px;margin:auto;padding:18px}.top{background:#111827;color:white;padding:18px}.c{background:white;padding:18px;border-radius:18px;margin:14px 0}.g,.m{display:grid;grid-template-columns:1fr 1fr;gap:10px}select,input{width:100%;padding:13px;font-size:17px;box-sizing:border-box;border:1px solid #ddd;border-radius:11px}button{padding:17px;border:0;border-radius:14px;color:white;font-weight:800;font-size:17px}.in{background:#16a34a}.bs{background:#ca8a04}.be{background:#2563eb}.out,.del{background:#dc2626}.admin{background:#111827}.metric{background:#f5f6f8;padding:12px;border-radius:12px}.metric b{display:block;font-size:20px}.hide{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{padding:10px;font-size:14px}.sr{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #eee}.sr button{padding:8px;font-size:12px}.tw{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th,td{padding:9px 6px;border-bottom:1px solid #eee;text-align:right}th:first-child,td:first-child{text-align:left}.total{font-weight:800;background:#f5f6f8}.note{font-size:12px;color:#6b7280}.actions button{background:#374151}.actions{margin-top:12px}@media print{body{background:white}.top,.no-print{display:none!important}.c{box-shadow:none;border:0;margin:0;padding:8px}.w{max-width:none;padding:0}}</style></head><body>
<div class="top"><h2>ZUCCA 勤怠</h2><div id="clock"></div></div><div class="w">
<div class="c no-print"><b>スタッフ</b><select id="staff"><option value="">読み込み中...</option></select><p id="status"></p><div class="g"><button class="in" onclick="stamp('出勤')">出勤</button><button class="bs" onclick="stamp('休憩開始')">休憩開始</button><button class="be" onclick="stamp('休憩終了')">休憩終了</button><button class="out" onclick="stamp('退勤')">退勤</button></div><p class="note">出勤は15分単位で繰り上げ（例：16:05 → 16:15）／退勤は実際の時刻をそのまま記録</p></div>
<div class="c"><b>本日の勤務</b><div id="log"></div><div class="m"><div class="metric">実働<b id="work">--</b></div><div class="metric">休憩<b id="brk">--</b></div><div class="metric">残業（8時間超）<b id="ot">--</b></div><div class="metric">深夜（22時以降）<b id="night">--</b></div></div></div>
<div class="c"><b>月間勤務（21日〜翌20日）</b><p id="period"></p><div class="tw"><table><thead><tr><th>日付</th><th>実働</th><th>休憩</th><th>残業</th><th>深夜</th></tr></thead><tbody id="monthly"></tbody><tfoot id="totals"></tfoot></table></div></div>
<div class="c no-print"><b>管理者メニュー</b><div id="pb" class="row"><input id="pin" type="password" placeholder="管理者PIN" style="flex:1"><button class="admin" onclick="login()">開く</button></div><div id="ad" class="hide"><div class="row"><input id="nn" placeholder="新しいスタッフ名" style="flex:1"><button class="admin" onclick="add()">追加</button></div><div id="list"></div><hr><b>打刻の修正・削除</b><p class="note">スタッフと日付を選んで、過去の出勤・休憩・退勤時刻を修正できます。</p><div class="row"><select id="editStaff" style="flex:1"></select><input id="editDate" type="date" style="flex:1"><button class="admin" onclick="loadEdit()">読み込む</button></div><div id="editRows"></div><div class="row actions"><button onclick="addEditRow()">打刻を追加</button><button onclick="saveEdits()">修正を保存</button></div><p id="editMsg" class="note"></p><hr><b>締め日用・全スタッフ一覧</b><div class="tw"><table><thead><tr><th>スタッフ</th><th>出勤日数</th><th>実働</th><th>休憩</th><th>残業</th><th>深夜</th></tr></thead><tbody id="allmonthly"></tbody></table></div><div class="row actions"><button onclick="csv()">CSV出力</button><button onclick="printReport()">PDF/印刷</button></div></div></div>
<div id="printAll" class="c hide"><h2>全スタッフ 月間勤怠集計</h2><p id="printPeriod"></p><div class="tw"><table><thead><tr><th>スタッフ</th><th>出勤日数</th><th>実働</th><th>休憩</th><th>残業</th><th>深夜</th></tr></thead><tbody id="printBody"></tbody></table></div></div>
</div><script>
const PHOTO_STAFF=["チノ", "アスカ", "ヒヨリ", "チヒロ", "ユウスケ", "アオイ", "ユイ", "ミユ", "ナナ", "リサ", "ミライ", "シャナ", "マホ", "サチコ", "ウスイ", "リュウエイ", "マサハル", "ケイコ", "サツキ", "シュウ"];const Q=x=>document.getElementById(x),SK='zucca_staff_v2',DK='zucca',DEF=["チノ", "アスカ", "ヒヨリ", "チヒロ", "ユウスケ", "アオイ", "ユイ", "ミユ", "ナナ", "リサ", "ミライ", "シャナ", "マホ", "サチコ", "ウスイ", "リュウエイ", "マサハル", "ケイコ", "サツキ", "シュウ"];
function migrateData(){try{
  // 初回だけ旧名の修正と初期スタッフ登録を行う。削除後は自動復活させない。
  const MK='zucca_staff_migrated_v16';
  let raw=localStorage.getItem(SK),a=raw?JSON.parse(raw):[];
  const rename={'シナ':'シャナ','リュウセイ':'リュウエイ','リクタイ':'リュウエイ'};
  const remove=new Set(['ショウタ','シェフ','オギ']);
  a=(Array.isArray(a)?a:[]).map(n=>rename[n]||n).filter(n=>!remove.has(n));
  if(!localStorage.getItem(MK)){
    if(!raw||!a.length) a=[...DEF];
    localStorage.setItem(MK,'1');
  }
  a=[...new Set(a)]; localStorage.setItem(SK,JSON.stringify(a));
  let d=JSON.parse(localStorage.getItem(DK)||'{}');
  for(const [oldn,newn] of Object.entries(rename)){if(d[oldn]){d[newn]??={};for(const [day,rows] of Object.entries(d[oldn])){if(!d[newn][day])d[newn][day]=rows}delete d[oldn]}}
  localStorage.setItem(DK,JSON.stringify(d));
}catch(e){}}
function staff(){try{migrateData();const v=JSON.parse(localStorage.getItem(SK)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}} function safe(s){return String(s).replace(/[&<>]/g,'')}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fillStaffSelect(el,names,keep){if(!el)return;el.replaceChildren();names.forEach(n=>{const op=document.createElement('option');op.value=n;op.textContent=n;el.appendChild(op)});if(keep&&names.includes(keep))el.value=keep;else if(names.length)el.selectedIndex=0}
function rs(){const a=staff();const main=Q('staff');const o=main?main.value:'';fillStaffSelect(main,a,o);if(Q('editStaff')){const eo=Q('editStaff').value;fillStaffSelect(Q('editStaff'),a,eo)}rl();render();allSummary()}
function punchTime(kind){let d=new Date(),h=d.getHours(),m=d.getMinutes();if(kind==='出勤'){m=Math.ceil(m/15)*15}else if(kind!=='退勤'){m=Math.round(m/15)*15}if(m===60){h++;m=0}if(h<9){h=9;m=0}return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function stamp(k){let x=JSON.parse(localStorage.getItem(DK)||'{}'),s=Q('staff').value,day=iso(new Date());x[s]??={};x[s][day]??=[];x[s][day].push([k,punchTime(k)]);localStorage.setItem(DK,JSON.stringify(x));render();allSummary()}
function mins(t){let a=t.split(':').map(Number);return a[0]*60+a[1]} function fmt(n){if(n==null)return'--';n=Math.max(0,Math.round(n));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function calc(a){let ci=a.find(v=>v[0]=='出勤'),co=[...a].reverse().find(v=>v[0]=='退勤'),b=0,nb=0,op=null;for(let v of a){if(v[0]=='休憩開始')op=mins(v[1]);if(v[0]=='休憩終了'&&op!=null){let e=mins(v[1]);b+=Math.max(0,e-op);nb+=Math.max(0,e-Math.max(op,1320));op=null}}if(!ci||!co)return[null,b,null,null];let st=mins(ci[1]),en=mins(co[1]);if(en<st)en+=1440;let w=Math.max(0,en-st-b);return[w,b,Math.max(0,w-480),Math.max(0,en-Math.max(st,1320)-nb)]}
function range(){let n=new Date(),s=n.getDate()>=21?new Date(n.getFullYear(),n.getMonth(),21):new Date(n.getFullYear(),n.getMonth()-1,21);return[s,new Date(s.getFullYear(),s.getMonth()+1,20)]}
function render(){let x=JSON.parse(localStorage.getItem(DK)||'{}'),s=Q('staff').value,d=iso(new Date()),a=x[s]?.[d]||[];Q('log').innerHTML=a.map(v=>'<p>'+v[0]+' <b>'+v[1]+'</b></p>').join('')||'<p>まだ打刻はありません</p>';Q('status').textContent=a.length?'最後：'+a[a.length-1][0]:'未打刻';let c=calc(a);['work','brk','ot','night'].forEach((z,i)=>Q(z).textContent=fmt(c[i]));month(x,s)}
function month(x,s){let [st,en]=range(),d=new Date(st),rows=[],tot=[0,0,0,0];Q('period').textContent=iso(st)+' ～ '+iso(en);while(d<=en){let k=iso(d),a=x[s]?.[k]||[];if(a.length){let c=calc(a);rows.push('<tr><td>'+(d.getMonth()+1)+'/'+d.getDate()+'</td>'+c.map(v=>'<td>'+fmt(v)+'</td>').join('')+'</tr>');c.forEach((v,i)=>{if(v!=null)tot[i]+=v})}d.setDate(d.getDate()+1)}Q('monthly').innerHTML=rows.join('')||'<tr><td colspan="5">この期間の打刻はありません</td></tr>';Q('totals').innerHTML='<tr class="total"><td>合計</td>'+tot.map(v=>'<td>'+fmt(v)+'</td>').join('')+'</tr>'}
function staffTotal(x,s){let [st,en]=range(),d=new Date(st),tot=[0,0,0,0],days=0;while(d<=en){let a=x[s]?.[iso(d)]||[];if(a.some(v=>v[0]==='出勤'))days++;let c=calc(a);c.forEach((v,i)=>{if(v!=null)tot[i]+=v});d.setDate(d.getDate()+1)}return [days,...tot]}
function allSummary(){let x=JSON.parse(localStorage.getItem(DK)||'{}');let rows=staff().map(s=>{let t=staffTotal(x,s);return '<tr><td>'+safe(s)+'</td><td>'+t[0]+'</td>'+t.slice(1).map(v=>'<td>'+fmt(v)+'</td>').join('')+'</tr>'}).join('');Q('allmonthly').innerHTML=rows;Q('printBody').innerHTML=rows;let r=range();Q('printPeriod').textContent=iso(r[0])+' ～ '+iso(r[1])}
function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function defaultEditDate(){if(Q('editDate')&&!Q('editDate').value)Q('editDate').value=iso(new Date())}
function loadEdit(){defaultEditDate();let x=JSON.parse(localStorage.getItem(DK)||'{}'),s=Q('editStaff').value,d=Q('editDate').value,a=(x[s]?.[d]||[]).map(v=>[v[0],v[1]]);window._zuccaEdit=a;renderEditRows();Q('editMsg').textContent=a.length?'打刻を読み込みました':'この日の打刻はありません。必要なら「打刻を追加」できます。'}
function renderEditRows(){let a=window._zuccaEdit||[];Q('editRows').innerHTML=a.map((v,i)=>'<div class="row" style="margin-top:8px"><select onchange="_zuccaEdit['+i+'][0]=this.value" style="flex:1"><option'+(v[0]=='出勤'?' selected':'')+'>出勤</option><option'+(v[0]=='休憩開始'?' selected':'')+'>休憩開始</option><option'+(v[0]=='休憩終了'?' selected':'')+'>休憩終了</option><option'+(v[0]=='退勤'?' selected':'')+'>退勤</option></select><input type="time" step="60" value="'+escAttr(v[1])+'" onchange="_zuccaEdit['+i+'][1]=this.value" style="flex:1"><button class="del" onclick="deleteEditRow('+i+')">削除</button></div>').join('')||'<p class="note">打刻なし</p>'}
function addEditRow(){window._zuccaEdit=window._zuccaEdit||[];window._zuccaEdit.push(['出勤','09:00']);renderEditRows()}
function deleteEditRow(i){if(!confirm('この打刻を削除しますか？'))return;window._zuccaEdit.splice(i,1);renderEditRows()}
function saveEdits(){defaultEditDate();let s=Q('editStaff').value,d=Q('editDate').value;if(!s||!d)return;let a=(window._zuccaEdit||[]).filter(v=>v[0]&&v[1]).map(v=>[v[0],v[1]]);let x=JSON.parse(localStorage.getItem(DK)||'{}');x[s]??={};if(a.length)x[s][d]=a;else if(x[s])delete x[s][d];localStorage.setItem(DK,JSON.stringify(x));Q('editMsg').textContent='保存しました。実働・残業・深夜・月間合計を再計算しました。';render();allSummary()}
function login(){if(Q('pin').value==='1234'){Q('pb').classList.add('hide');Q('ad').classList.remove('hide');defaultEditDate();rs();rl();allSummary()}else alert('PINが違います')}
function add(){let n=Q('nn').value.trim(),a=staff();if(!n||a.includes(n))return;a.push(n);localStorage.setItem(SK,JSON.stringify(a));Q('nn').value='';rs()} function del(n){if(confirm(n+'を削除しますか？')){localStorage.setItem(SK,JSON.stringify(staff().filter(x=>x!==n)));rs()}}
function rl(){const box=Q('list');box.replaceChildren();staff().forEach(n=>{const row=document.createElement('div');row.className='sr';const sp=document.createElement('span');sp.textContent=n;const b=document.createElement('button');b.className='del';b.textContent='削除';b.onclick=()=>del(n);row.append(sp,b);box.appendChild(row)})}
function csv(){let x=JSON.parse(localStorage.getItem(DK)||'{}'),r=range(),lines=['スタッフ,期間,出勤日数,実働,休憩,残業,深夜'];staff().forEach(s=>{let t=staffTotal(x,s);lines.push('"'+s.replace(/"/g,'""')+'","'+iso(r[0])+'～'+iso(r[1])+'",'+t[0]+','+t.slice(1).map(fmt).join(','))});let blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ZUCCA勤怠_'+iso(r[0])+'_'+iso(r[1])+'.csv';a.click();URL.revokeObjectURL(a.href)}
function printReport(){Q('printAll').classList.remove('hide');window.print();setTimeout(()=>Q('printAll').classList.add('hide'),500)}
function init(){const st=Q('staff');if(st){st.addEventListener('change',render);st.addEventListener('input',render)}setInterval(()=>{const c=Q('clock');if(c)c.textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})},1000);rs()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script></body></html>
